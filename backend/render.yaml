services:
  - type: web
    name: drishti-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,http://localhost:3000,https://drishti.vercel.app"
      - key: GEMINI_API_KEY
        sync: false
